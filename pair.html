<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Philips Pairing • Smart TV Controller</title><link rel="stylesheet" href="css/style.css"></head><body><main style="max-width:720px;margin:0 auto;padding-top:48px"><div class="card"><span class="eyebrow">PHILIPS JOINTSPACE</span><h1>Pair your Philips TV</h1><p>Modern Philips Android TVs use one-time JointSpace credentials. Enter the username/password produced during TV pairing. They are stored only in <code>bridge/devices.local.json</code> on this computer and that file is ignored by Git.</p><label>TV IP address<input id="ip" placeholder="192.168.1.50"></label><label>JointSpace username<input id="username" autocomplete="off"></label><label>JointSpace password<input id="password" type="password" autocomplete="off"></label><div class="hero-actions"><button id="save" class="btn primary">Save credentials</button><a href="./" class="btn secondary" style="text-decoration:none">Back to controller</a></div><p id="result" class="muted" style="margin-top:18px"></p></div></main><script>const result=document.getElementById('result');document.getElementById('save').onclick=async()=>{const ip=document.getElementById('ip').value.trim(),username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!ip||!username||!password){result.textContent='Fill in all fields.';return}result.textContent='Saving…';try{const r=await fetch('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,brand:'philips',deviceId:`philips:${ip}`,username,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save credentials');const test=await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:`philips:${ip}`,ip,brand:'philips',name:'Philips TV'})});const td=await test.json();if(!test.ok)throw new Error(td.error||'Credentials saved, but connection test failed');result.textContent=`Connected successfully to ${td.device?.name||'Philips TV'}.`; }catch(e){result.textContent=e.message}}</script></body></html>
