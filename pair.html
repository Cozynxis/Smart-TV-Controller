<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Philips koppelen • Smart TV Controller</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    .pair-wrap{max-width:760px;margin:0 auto;padding:48px 20px}.pair-step{display:none}.pair-step.active{display:block}.pin-input{font-size:28px;letter-spacing:10px;text-align:center;font-weight:800}.status-box{margin-top:18px;padding:14px 16px;border:1px solid var(--line,#263047);border-radius:14px;background:rgba(255,255,255,.03)}.status-box.ok{border-color:#3fcf8e}.status-box.error{border-color:#ff647c}.status-box.busy{border-color:#7c5cff}.step-row{display:flex;gap:10px;align-items:center;margin:20px 0}.step-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(124,92,255,.18);font-weight:800}.pair-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.mini{font-size:13px;margin-top:8px;opacity:.8}.hidden{display:none!important}
  </style>
</head>
<body>
<main class="pair-wrap">
  <div class="card">
    <span class="eyebrow">PHILIPS JOINTSPACE</span>
    <h1>TV koppelen</h1>
    <p>De bridge vraagt automatisch een eenmalige PIN aan bij je Philips TV.</p>

    <div class="step-row"><span class="step-dot">1</span><div><b>Vraag een PIN aan</b><div class="muted">De TV moet aanstaan en op hetzelfde netwerk zitten.</div></div></div>
    <label>TV IP-adres<input id="ip" placeholder="192.168.2.50" autocomplete="off"></label>
    <div class="pair-actions"><button id="requestPin" class="btn primary">PIN aanvragen</button><a href="./" class="btn secondary" style="text-decoration:none">Terug</a></div>

    <section id="pinStep" class="pair-step">
      <div class="step-row"><span class="step-dot">2</span><div><b>Vul de code van je TV in</b><div class="muted">Kijk op het scherm van de Philips TV.</div></div></div>
      <label>PIN<input id="pin" class="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="one-time-code"></label>
      <div class="pair-actions"><button id="grantPin" class="btn primary">Koppelen & verbinden</button><button id="again" class="btn secondary">Nieuwe PIN</button></div>
    </section>

    <div id="result" class="status-box">Klaar om de pairing te starten.</div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const ip=$('#ip'),pin=$('#pin'),result=$('#result'),pinStep=$('#pinStep');
const requestButton=$('#requestPin'),grantButton=$('#grantPin');
const params=new URLSearchParams(location.search);if(params.get('ip'))ip.value=params.get('ip');
let requestSeq=0;
let activeController=null;
function status(text,type=''){result.className='status-box'+(type?' '+type:'');result.textContent=text}
async function post(path,body,timeoutMs=12000,controller){
  const ctrl=controller||new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const r=await fetch(path+'?t='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify(body),signal:ctrl.signal,cache:'no-store'});
    const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={}}
    if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);
    return data;
  }catch(e){
    if(e.name==='AbortError')throw new Error('De TV antwoordde niet op tijd. Klik opnieuw op PIN aanvragen.');
    throw e;
  }finally{clearTimeout(timer)}
}
async function requestPin(){
  const tvIp=ip.value.trim();
  if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(tvIp)){status('Vul eerst een geldig IP-adres in.','error');return}
  const seq=++requestSeq;
  if(activeController)activeController.abort();
  activeController=new AbortController();
  pinStep.classList.remove('active');
  requestButton.disabled=true;
  requestButton.textContent='PIN aanvragen…';
  status('Pairing-request wordt naar de TV gestuurd…','busy');
  try{
    const d=await post('/api/pair/request',{ip:tvIp},12000,activeController);
    if(seq!==requestSeq)return;
    pinStep.classList.add('active');
    status(d.message||'PIN aangevraagd. Kijk nu op je TV.','ok');
    pin.focus();
  }catch(e){
    if(seq!==requestSeq)return;
    status('PIN aanvragen mislukt: '+e.message,'error');
  }finally{
    if(seq===requestSeq){
      activeController=null;
      requestButton.disabled=false;
      requestButton.textContent='PIN opnieuw aanvragen';
    }
  }
}
async function grantPin(){
  const tvIp=ip.value.trim(),code=pin.value.trim();
  if(!/^\d{4,8}$/.test(code)){status('Vul de PIN in die op de TV staat.','error');return}
  grantButton.disabled=true;status('PIN controleren en verbinding opslaan…','busy');
  try{
    const d=await post('/api/pair/grant',{ip:tvIp,pin:code},18000);
    localStorage.setItem('pairedTv',JSON.stringify(d.device||{}));
    status(`Gelukt! Verbonden met ${d.device?.name||'Philips TV'}. Je gaat terug naar de controller…`,'ok');
    setTimeout(()=>location.href='./',1000);
  }catch(e){status('Koppelen mislukt: '+e.message,'error');pin.select()}
  finally{grantButton.disabled=false}
}
requestButton.onclick=requestPin;grantButton.onclick=grantPin;$('#again').onclick=requestPin;pin.addEventListener('keydown',e=>{if(e.key==='Enter')grantPin()});
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{})}
</script>
</body>
</html>
